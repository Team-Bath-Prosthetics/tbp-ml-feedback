[project]
name = "tactile"
version = "0.1.0"
description = "Dataset generation and autoencoder benchmarking for prosthetic tactile feedback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "wandb>=0.16",
]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tactile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
